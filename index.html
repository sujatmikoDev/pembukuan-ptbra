<!DOCTYPE html>
<html lang="id" data-tema="merah" data-mode="terang">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembukuan - PT Berkah Riyad Abadi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B71C1C">
<link rel="icon" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<script>
/* Pemasang gaya tampilan. Sengaja lewat JavaScript supaya tidak terpengaruh penyaringan HTML/CSS oleh Blogger. */
(function () {
  /* Terapkan tema & mode secepat mungkin dari cache perangkat, sebelum CSS dan sebelum apa pun lain,
     supaya tidak ada kedipan warna saat halaman baru dibuka. */
  try {
    var c = JSON.parse(localStorage.getItem('pbk_pub') || 'null');
    if (c && c.tema) document.documentElement.dataset.tema = c.tema;
    if (c && c.mode) document.documentElement.dataset.mode = c.mode;
  } catch (e) {}
  try {
    if (/[?&]m=1(&|$)/.test(location.search) && !sessionStorage.getItem('pbk_m0')) {
      sessionStorage.setItem('pbk_m0', '1');
      location.replace(location.href.replace(/([?&])m=1(?=&|#|$)/, '$1m=0'));
      return;
    }
  } catch (e) {}
  var css = String.raw`:root{
  --p:#B71C1C; --p2:#D4A017;
  --bg:#FBF1EC; --card:#FFFFFF; --text:#1A1F36; --muted:#667085; --line:#E7E9F2;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -14px rgba(16,24,40,.14);
  --ok:#16A34A; --warn:#D97706; --bad:#DC2626; --info:#2563EB;
  --tint:color-mix(in srgb,var(--p) 9%,var(--card)); --tint2:color-mix(in srgb,var(--p) 17%,var(--card));
  --r:18px; --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
/* Warna aksen (--p/--p2) TETAP seperti sebelumnya, tidak diubah. Hanya latar (--bg/--card) yang kini ikut tema. */
html[data-tema=biru]{--p:#2563EB;--p2:#38BDF8;--bg:#EEF4FC;--card:#FFFFFF}
html[data-tema=hijau]{--p:#059669;--p2:#34D399;--bg:#EEF9F3;--card:#FFFFFF}
html[data-tema=ungu]{--p:#5B21B6;--p2:#D4AF37;--bg:#F6F1FB;--card:#FFFFFF}
html[data-tema=burgundy]{--p:#6D0F2B;--p2:#C9A227;--bg:#FBF0F1;--card:#FFFFFF}
html[data-mode=gelap]{--text:#E8EBF5;--muted:#9AA3BF;--line:#252A44;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--info:#60A5FA}
/* Latar gelap juga mengikuti tema (dipisah dari blok mode di atas supaya selalu menang). */
html[data-tema=merah][data-mode=gelap]{--bg:#1C120D;--card:#241712}
html[data-tema=burgundy][data-mode=gelap]{--bg:#190B10;--card:#22101A}
html[data-tema=ungu][data-mode=gelap]{--bg:#130B1F;--card:#1C1229}
html[data-tema=biru][data-mode=gelap]{--bg:#081524;--card:#0E2238}
html[data-tema=hijau][data-mode=gelap]{--bg:#06180F;--card:#0B2419}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden!important}
.blogger-element,#navbar-iframe,.widget,.post-footer,.comments,.header-widget{display:none!important}
body{font-family:var(--font);-webkit-font-smoothing:antialiased}
#app-root{text-align:left;direction:ltr;letter-spacing:normal;text-transform:none;font-style:normal;position:fixed;inset:0;z-index:2147483647;overflow:auto;-webkit-overflow-scrolling:touch;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
#app-root::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(520px 380px at 8% -4%,color-mix(in srgb,var(--p) 14%,transparent),transparent 70%),
  radial-gradient(560px 420px at 100% 100%,color-mix(in srgb,var(--p2) 16%,transparent),transparent 70%)}
#app-root h1,#app-root h2,#app-root h3,#app-root h4,#app-root h5,#app-root h6,#app-root p,#app-root span,#app-root div,#app-root label,#app-root small,#app-root b,#app-root strong,#app-root a{color:inherit!important;font-family:inherit!important;text-transform:none!important;text-align:left;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.ic{width:20px;height:20px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;text-align:right}
:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 55%,transparent);outline-offset:2px}

/* progress bar atas */
#topbar-progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--p),var(--p2));z-index:3000;transition:width .4s ease,opacity .3s;opacity:0}
#topbar-progress.on{opacity:1}

/* login */
#login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:36px 32px;border:1px solid var(--line)}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px;text-align:center}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;overflow:hidden;box-shadow:0 10px 24px -10px var(--p)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:6px}
.logo.sm{width:44px;height:44px;border-radius:13px;font-size:17px}
.logo.sm img{padding:3px}
.login-brand h1{font-size:22px}
.login-brand p{margin:0;color:var(--muted);font-size:14px}

/* form */
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 16%,transparent)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;accent-color:var(--p)}
input[readonly]{background:var(--tint)}
textarea{min-height:76px;resize:vertical}
.field{margin-bottom:16px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.err-text{color:var(--bad);font-size:13px;margin-top:6px}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--p);background:var(--tint)}
a.btn{text-decoration:none;color:inherit}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,var(--p2)));color:#fff;border-color:transparent;box-shadow:0 10px 20px -10px var(--p)}
.btn.primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,var(--p2)))}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.icon-btn{width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.icon-btn:hover{background:var(--tint);border-color:var(--p)}

/* shell */
#shell{position:relative;z-index:1;display:flex;min-height:100vh}
.pbk-sidebar{width:272px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;transition:transform .28s ease}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand b{display:block;font-size:15px;line-height:1.25}
.brand small{color:var(--muted);font-size:12px}
.nav-group{font-size:12px;font-weight:700;color:var(--muted);padding:14px 12px 4px;letter-spacing:.02em}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:13px;border:0;background:transparent;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;text-align:left;transition:background .18s,color .18s}
.nav-item:hover{background:var(--tint);color:var(--text)}
.nav-item.active{background:var(--tint2);color:var(--p)}
.nav-item .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;padding-top:14px}
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.pbk-content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 32px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar .greet{flex:1;min-width:0}
.topbar h2{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar p{margin:0;color:var(--muted);font-size:14px}
.chip-date{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.user-chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;cursor:pointer;position:relative}
.avatar{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.user-chip b{font-size:14px;display:block;line-height:1.2}
.user-chip small{font-size:12px;color:var(--muted)}
.pbk-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:210px;padding:6px;z-index:60}
.pbk-menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left}
.pbk-menu button:hover{background:var(--tint)}
.menu-btn{display:none}
main#pbk-main{padding:8px 32px 48px;max-width:1280px;width:100%}
.view{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* kartu */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card h3{font-size:17px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.grid{display:grid;gap:20px;margin-bottom:20px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:14px;align-items:stretch;padding:20px;container-type:inline-size}
.kpi-top{display:flex;gap:14px;align-items:center}
.kpi-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.kpi-ic .ic{width:24px;height:24px}
.c-ok{background:linear-gradient(135deg,#16A34A,#4ADE80)}
.c-info{background:linear-gradient(135deg,#2563EB,#60A5FA)}
.c-bad{background:linear-gradient(135deg,#DC2626,#FB7185)}
.c-warn{background:linear-gradient(135deg,#D97706,#FBBF24)}
.c-p{background:linear-gradient(135deg,var(--p),var(--p2))}
.kpi-l{font-size:13px;color:var(--muted);font-weight:600}
.kpi-v{font-size:20px;font-size:clamp(15px,9.4cqw,26px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-s{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut circle.seg{animation:draw .9s ease-out both;transform:rotate(-90deg);transform-origin:60px 60px}
@keyframes draw{from{stroke-dasharray:0 400}}
.donut-list{flex:1;min-width:140px;display:grid;gap:8px;font-size:14px}
.donut-list div{display:flex;align-items:center;gap:8px}
.donut-list i{width:10px;height:10px;border-radius:50%;flex:none}
.donut-list span:last-child{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.prog{margin:14px 0}
.prog .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.prog .t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .t{gap:10px}
.prog .bg{height:9px;border-radius:99px;background:var(--tint2);overflow:hidden}
.prog .fg{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2));transform-origin:left;animation:fill .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{transform:scaleX(0)}}
.list{display:grid;gap:4px;grid-template-columns:minmax(0,1fr)}
.li{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px}
.li.click{cursor:pointer}
.li.click:hover{background:var(--tint)}
.li .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tint2);color:var(--p)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{color:var(--muted);font-size:13px}
.li .r{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}

/* chip status */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.chip.info{background:color-mix(in srgb,var(--info) 14%,var(--card));color:var(--info)}
.chip.mute{background:var(--tint2);color:var(--muted)}

/* tabel */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--tint);color:var(--muted);font-weight:700;font-size:13px;text-align:left;padding:12px 14px;white-space:nowrap;position:sticky;top:0}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--tint)}
tr.b td{font-weight:800;background:var(--tint)}
tr.total td{font-weight:800;background:var(--tint2)}
td.num,th.num{text-align:right}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .field{margin:0;min-width:150px}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:24px;flex:1}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.pill b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.pill span{color:var(--muted);font-size:13px}

/* tile jenis transaksi */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);border-color:var(--p);box-shadow:var(--shadow)}
.tile .ti{width:48px;height:48px;border-radius:14px;background:var(--tint2);color:var(--p);display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:15px}
.tile small{color:var(--muted);font-size:13px}
.form-card{margin-bottom:20px}
.form-card h3{margin-bottom:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:150px;display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg label:has(input:checked){border-color:var(--p);background:var(--tint)}
.item-row{display:grid;grid-template-columns:2.2fr .9fr .9fr 1.3fr 1.4fr 44px;gap:10px;align-items:center;margin-bottom:10px}
.item-row .jum{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.sum{background:var(--tint);border-radius:14px;padding:14px 16px;font-size:15px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.sum b{white-space:nowrap}
.sum .grand{border-top:2px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:800;font-size:18px}
.warn-box{display:flex;gap:10px;background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;margin-top:10px}
.info-box{display:flex;gap:10px;background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.file-row{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.file-row .th{width:52px;height:52px;border-radius:10px;background:var(--tint2);display:grid;place-items:center;overflow:hidden;flex:none}
.file-row .th img{width:100%;height:100%;object-fit:cover}
.file-row .nm{flex:1;min-width:0;font-size:14px}
.file-row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-row select{width:auto;min-width:150px}
.checks label{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.checks label:has(input:checked){border-color:var(--p);background:var(--tint)}
.pbk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pbk-tab{padding:9px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;font-size:14px}
.pbk-tab.active{background:var(--tint2);border-color:var(--p);color:var(--p)}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.swatch{width:104px;border:2px solid var(--line);border-radius:16px;background:var(--card);padding:10px;cursor:pointer;text-align:center;font-weight:600;font-size:14px;transition:transform .15s,border-color .2s}
.swatch:hover{transform:translateY(-2px)}
.swatch i{display:block;height:44px;border-radius:11px;margin-bottom:8px}
.swatch.active{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 16%,transparent)}
.swatch.active::after{content:"Dipilih";display:block;color:var(--p);font-weight:700;font-size:12px}
.logo-up{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

/* modal dan toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,24,.55);display:grid;place-items:center;padding:16px;z-index:2000;animation:fade .2s ease both;overflow-y:auto}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow-y:auto;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.9,.3,1.1) both}
.modal.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.modal h3{font-size:20px;margin-bottom:6px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.big-no{font-size:28px;font-weight:800;letter-spacing:.01em;text-align:center;background:var(--tint2);color:var(--p);border-radius:16px;padding:18px 12px;margin:14px 0;word-break:break-all}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px;margin:14px 0}
.kv div small{display:block;color:var(--muted);font-size:12px}
.kv div b{font-size:14px}
#toast-root{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:4000;display:grid;gap:8px;width:min(92vw,440px)}

.toast{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);font-weight:600;font-size:14px;animation:pop .25s ease both}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--tint) 25%,var(--tint2) 50%,var(--tint) 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:20px}
@keyframes sh{to{background-position:-200% 0}}
.spin{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g-main,.g-3{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .pbk-sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);box-shadow:var(--shadow);width:290px}
  .nav-open .pbk-sidebar{transform:none}
  .nav-open .scrim{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .topbar{padding:14px 16px}
  .chip-date{display:none}
  main#pbk-main{padding:4px 16px 40px}
  .user-chip div:not(.avatar){display:none}
  .user-chip{padding:4px}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr}
  .row2,.row3,.tiles,.kv{grid-template-columns:1fr}
  .item-row{grid-template-columns:1fr 1fr}
  .item-row .full{grid-column:1/-1}
  .topbar h2{font-size:18px}
  .kpi-v{font-size:21px}
  .modal{padding:20px}
  .file-row{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
/* Bilah atribusi: ditaruh paling akhir supaya pasti menang dari aturan padding/sidebar sebelumnya. */
#pbk-credit{position:fixed;left:0;right:0;bottom:0;z-index:1500;display:flex;align-items:center;justify-content:center;gap:10px;height:40px;padding:0 14px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
#pbk-credit b{color:var(--text)}
#pbk-credit a{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted);border:1px solid var(--line);transition:color .18s,border-color .18s,background .18s,transform .18s}
#pbk-credit a:hover{transform:scale(1.14) translateY(-1px)}
#pbk-credit a.wa:hover{color:#25D366;border-color:#25D366;background:color-mix(in srgb,#25D366 12%,transparent)}
#pbk-credit a.ig:hover{color:#E1306C;border-color:#E1306C;background:color-mix(in srgb,#E1306C 12%,transparent)}
#pbk-credit a.pf:hover{color:var(--p);border-color:var(--p);background:var(--tint)}

#login{padding-bottom:50px!important}
main#pbk-main{padding-bottom:50px!important}
.pbk-sidebar{padding-bottom:50px!important}
@media (max-width:480px){#pbk-credit{gap:8px;height:36px}.pbk-credit-txt{display:none}}

function api(action, payload) {
  return new Promise((resolve, reject) => {
    progress(true);
    const done = r => {
      progress(false);
      if (r && r.ok) return resolve(r.data);
      const m = (r && r.msg) || 'Terjadi kesalahan.';
      if (/Sesi habis|belum login/i.test(m)) { toast('Sesi berakhir. Silakan login kembali.', 'warn'); forceLogout(); }
      reject(new Error(m));
    };
    const fail = e => { progress(false); reject(new Error((e && e.message) || 'Gagal menghubungi server.')); };
    if (GAS_URL) {
      fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ token: S.token, action: action, payload: payload || {} }) })
        .then(r => r.json()).then(done, e => fail({ message: 'Gagal menghubungi server. Periksa koneksi dan URL deploy.' }));
    } else if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).rpc(S.token, action, payload || {});
    } else {
      mockRpc(action, payload || {}).then(done, fail);
    }
  });
}

function ppnOf(dpp) { const p = S.master.pengaturan; const t = Math.round(p.ppn_tarif * 100), n = dpp * t * p.faktor_p, d = 10000 * p.faktor_q; return Math.floor((2 * n + d) / (2 * d)); }
function itemsDpp() { return S.items.reduce((s, i) => s + Math.round((Number(i.qty) || 0) * (Number(i.harga) || 0)), 0); }

function renderItems() {
  const M = S.master, el = $('#items'); if (!el) return;
  const prods = M.produk.filter(act);
  el.innerHTML = S.items.map((it, i) => `<div class="item-row" data-i="${i}">
    <div class="full"><select data-k="produk_id">${optList(prods, p => p.id, p => p.nama, it.produk_id, 'Pilih barang')}</select></div>
    <div><input type="number" data-k="qty" min="0" step="any" value="${it.qty}" aria-label="Qty" placeholder="Qty"></div>
    <div><input data-k="satuan" value="${esc(it.satuan)}" aria-label="Satuan" placeholder="Satuan" maxlength="12"></div>
    <div><input type="number" data-k="harga" min="0" value="${it.harga}" aria-label="Harga satuan" placeholder="Harga"></div>
    <div class="jum" id="jum-${i}">${rp(Math.round((Number(it.qty) || 0) * (Number(it.harga) || 0)))}</div>
    <button type="button" class="icon-btn" data-act="delItem" data-i="${i}" aria-label="Hapus baris" ${S.items.length < 2 ? 'disabled' : ''}>${ic('x')}</button></div>`).join('');
}
function recalc() {
  const jenis = S.txType, el = $('#sum'); if (!el) return;
  const ppnOn = $('#f-ppn') && $('#f-ppn').checked;
  let dpp = jenis === 'BIAYA' ? Math.round(Number($('#f-jml').value) || 0) : itemsDpp();
  const ppn = ppnOn ? ppnOf(dpp) : 0, tot = dpp + ppn;
  let h = `<div><span>DPP / subtotal</span><b>${rp(dpp)}</b></div><div><span>PPN (${S.master.pengaturan.ppn_tarif}% x ${S.master.pengaturan.faktor_p}/${S.master.pengaturan.faktor_q})</span><b>${rp(ppn)}</b></div><div><span>Total tagihan</span><b>${rp(tot)}</b></div>`;
  if (jenis === 'PENJUALAN') { const pot = Math.round(Number($('#f-pot').value) || 0); h += `<div><span>Dipotong pembeli</span><b>- ${rp(pot)}</b></div><div class="grand"><span>Piutang bersih diterima</span><b>${rp(tot - pot)}</b></div>`; }
  else h = h.replace('<div><span>Total tagihan</span>', '<div class="grand"><span>Total</span>').replace(/<b>([^<]*)<\/b><\/div>$/, '<b>$1</b></div>');
  el.innerHTML = h;
}
function fillRek(pihakId) {
  const w = $('#rekwrap'); if (!w) return;
  const rek = pihakId ? S.master.rekSupplier.filter(r => r.supplier_id === pihakId && act(r)) : [];
  if (rek.length) {
    w.innerHTML = fld('Rekening tujuan transfer', `<select id="f-rek">${rek.map(r => `<option value="${esc(r.id)}">${esc(r.nama_rekening)} - ${esc(r.bank)} ${esc(r.no_rekening)}</option>`).join('')}<option value="__lain">Rekening lain (perlu alasan)</option></select>`, 'Rekening resmi supplier. Transfer ke rekening lain wajib disertai alasan.') +
      `<div id="rek-lain" class="hidden">${fld('Rekening lain (nama - bank - nomor)', '<input id="f-rekteks" maxlength="120">')}${fld('Alasan memakai rekening lain', '<input id="f-rekalasan" maxlength="200">')}<div class="warn-box">${ic('alert')}<span>Rekening ini berbeda dari rekening resmi supplier. Pastikan benar.</span></div></div>`;
  } else {
    w.innerHTML = fld('Rekening tujuan transfer', '<input id="f-rekteks" maxlength="120" placeholder="Nama - bank - nomor rekening">', pihakId ? 'Supplier ini belum punya rekening resmi. Tambahkan di Data Master > Rekening Supplier.' : '');
  }
}
function renderFiles() {
  const el = $('#files'); if (!el) return;
  el.innerHTML = S.files.map((f, i) => `<div class="file-row"><div class="th">${f.dataUrl ? `<img alt="" src="${f.dataUrl}">` : ic('file')}</div><div class="nm"><b>${esc(f.name)}</b><span style="color:var(--muted)">${(f.size / 1024).toFixed(0)} KB</span></div><select data-fi="${i}">${JENIS_LAMP.map(j => `<option ${j === f.jenis ? 'selected' : ''}>${j}</option>`).join('')}</select><button type="button" class="icon-btn" data-act="delFile" data-i="${i}" aria-label="Hapus file">${ic('x')}</button></div>`).join('');
  const aw = $('#alasan-wrap'); if (aw) aw.classList.toggle('hidden', S.files.length > 0);
}
function suggestJenis(jenis, files) {
  const r = REQ[jenis] || {}, list = r.all || r.any || [], used = files.map(f => f.jenis);
  return list.find(x => used.indexOf(x) < 0) || 'Lainnya';
}
async function addFiles(list) {
  for (const file of Array.from(list)) {
    try {
      if (file.type === 'application/pdf') {
        if (file.size > 10 * 1024 * 1024) { toast(file.name + ': PDF lebih dari 10 MB.', 'bad'); continue; }
        S.files.push({ name: file.name, mime: 'application/pdf', b64: await fileToB64(file), size: file.size, jenis: suggestJenis(S.txType, S.files), dataUrl: '' });
      } else if (file.type.startsWith('image/')) {
        const c = await compressImage(file, 1600, 'image/jpeg', 0.8);
        S.files.push({ name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', b64: c.b64, size: Math.round(c.b64.length * 0.75), jenis: suggestJenis(S.txType, S.files), dataUrl: c.dataUrl });
      } else toast(file.name + ': hanya JPG, PNG, atau PDF.', 'bad');
    } catch (e) { toast(e.message, 'bad'); }
  }
  renderFiles();
}
function initTxForm(m, jenis) {
  renderItems(); renderFiles(); recalc();
  const form = $('#txf');
  form.addEventListener('input', e => {
    const t = e.target;
    if (t.closest('.item-row')) {
      const i = Number(t.closest('.item-row').dataset.i), k = t.dataset.k, it = S.items[i];
      if (k === 'produk_id') { it.produk_id = t.value; const p = S.master.produk.find(x => x.id === t.value); if (p) { it.harga = p.harga_standar; it.satuan = p.satuan; } renderItems(); }
      else { it[k] = t.value; const j = $('#jum-' + i); if (j) j.textContent = rp(Math.round((Number(it.qty) || 0) * (Number(it.harga) || 0))); }
    }
    if (t.id === 'f-potpct') { $('#f-pot').value = Math.round(itemsDpp() * (Number(t.value) || 0) / 100); }
    if (t.id === 'f-ref') onRefChange();
    if (t.id === 'f-pihak') { if (jenis === 'PEMBELIAN' || jenis === 'BIAYA') fillRek(t.value); }
    if (t.id === 'f-rek') $('#rek-lain').classList.toggle('hidden', t.value !== '__lain');
    if (t.name === 'sumber') $('#akun-wrap').classList.toggle('hidden', t.value === 'TALANGAN');
    if (t.name === 'cara') { $('#langsung').classList.toggle('hidden', t.value !== 'LANGSUNG'); if (t.value === 'LANGSUNG') fillRek($('#f-pihak').value); }
    if (t.dataset.fi !== undefined) S.files[Number(t.dataset.fi)].jenis = t.value;
    if (t.classList.contains('tal')) { const sum = $$('.tal:checked').reduce((s, c) => s + Number(c.dataset.t), 0); let b = $('#tal-sum'); if (!b) { b = document.createElement('p'); b.id = 'tal-sum'; b.className = 'hint'; $('.checks').after(b); } b.innerHTML = `Total yang direm bes: <b>${rp(sum)}</b>`; }
    recalc();
  });
  form.addEventListener('change', e => { if (e.target.id === 'inp-cam' || e.target.id === 'inp-file') { addFiles(e.target.files); e.target.value = ''; } });
  form.addEventListener('submit', e => { e.preventDefault(); submitTx(); });
  if (jenis === 'PEMBAYARAN_KELUAR') { onRefChange(); }
  if (jenis === 'BIAYA') fillRek('');
}
function onRefChange() {
  const sel = $('#f-ref'); if (!sel || !sel.selectedOptions[0]) return;
  const o = sel.selectedOptions[0]; const j = $('#f-jml'); if (j) j.value = o.dataset.s;
  if (S.txType === 'PEMBAYARAN_KELUAR') fillRek(o.dataset.p);
}

function collectTx() {
  const jenis = S.txType, v = id => { const e = $('#' + id); return e ? e.value.trim() : ''; };
  const p = { jenis, tanggal: v('f-tanggal'), deskripsi: v('f-desk'), alasan_tanpa_bukti: v('f-alasan') };
  const sumber = $('input[name=sumber]:checked');
  if (jenis === 'PENJUALAN') {
    if (!v('f-pihak')) throw new Error('Pilih client.');
    Object.assign(p, { pihak_id: v('f-pihak'), no_po: v('f-po'), no_ba: v('f-ba'), no_faktur_pajak: v('f-faktur'), tgl_kwitansi_diterima: v('f-kwit'), termin: v('f-termin'), pakai_ppn: $('#f-ppn').checked, potongan_pajak: Number(v('f-pot')) || 0 });
  }
  if (jenis === 'PEMBELIAN') {
    if (!v('f-pihak')) throw new Error('Pilih supplier.');
    Object.assign(p, { pihak_id: v('f-pihak'), no_dokumen: v('f-nodok'), no_faktur_pajak: v('f-faktur'), pakai_ppn: $('#f-ppn').checked, cara_bayar: $('input[name=cara]:checked').value });
  }
  if (jenis === 'PENJUALAN' || jenis === 'PEMBELIAN') {
    const items = S.items.filter(i => i.produk_id);
    if (!items.length) throw new Error('Pilih minimal satu barang.');
    if (items.some(i => !(Number(i.qty) > 0))) throw new Error('Qty harus lebih dari 0.');
    p.items = items.map(i => ({ produk_id: i.produk_id, qty: Number(i.qty), harga: Math.round(Number(i.harga) || 0), satuan: i.satuan }));
  }
  if (jenis === 'BIAYA') {
    if (!v('f-kat')) throw new Error('Pilih kategori biaya.');
    Object.assign(p, { kategori_id: v('f-kat'), jumlah: v('f-jml'), pihak_id: v('f-pihak'), pakai_ppn: $('#f-ppn').checked, no_faktur_pajak: v('f-faktur') });
  }
  if (jenis === 'PEMBAYARAN_MASUK' || jenis === 'PEMBAYARAN_KELUAR') {
    if (!v('f-ref')) throw new Error('Pilih tagihan yang dibayar.');
    Object.assign(p, { ref_id: v('f-ref'), jumlah: v('f-jml') });
  }
  if (jenis === 'REMBES_TALANGAN') p.item_ids = $$('.tal:checked').map(c => c.value);
  if (['KAS_AWAL', 'SETORAN_MODAL', 'DIVIDEN'].indexOf(jenis) > -1) p.jumlah = v('f-jml');
  if ($('#f-akun')) p.akun_kas_id = v('f-akun');
  if (['BIAYA', 'PEMBAYARAN_KELUAR'].indexOf(jenis) > -1 || (jenis === 'PEMBELIAN' && p.cara_bayar === 'LANGSUNG')) {
    p.sumber_dana = sumber ? sumber.value : 'KAS';
    const rek = $('#f-rek');
    if (rek && rek.value !== '__lain') p.rekening_tujuan_id = rek.value;
    else { p.rekening_tujuan_teks = v('f-rekteks'); p.alasan_rekening = v('f-rekalasan'); }
    if (p.sumber_dana === 'TALANGAN') delete p.akun_kas_id;
  }
  if (!S.files.length && p.alasan_tanpa_bukti.length < 5) { $('#alasan-wrap').classList.remove('hidden'); throw new Error('Tambahkan bukti, atau tulis alasan mengapa belum ada bukti.'); }
  return p;
}
async function submitTx() {
  let p; try { p = collectTx(); } catch (e) { return toast(e.message, 'bad'); }
  const ok = await confirmBox('Simpan transaksi?', `${esc(JENIS_LABEL[p.jenis])} tanggal ${tgl(p.tanggal)} dengan ${S.files.length} file bukti. Nomor bukti dibuat otomatis dan tidak bisa dihapus (hanya bisa di-void).`, 'Simpan');
  if (!ok) return;
  const btn = $('#txf button[type=submit]'); btn.disabled = true;
  let res;
  try { res = await api('saveTx', p); } catch (e) { btn.disabled = false; return toast(e.message, 'bad'); }
  const failed = [];
  for (let i = 0; i < S.files.length; i++) {
    const f = S.files[i];
    try { await api('uploadLampiran', { transaksi_id: res.id, jenis: f.jenis, mime: f.mime, name: f.name, b64: f.b64 }); } catch (e) { failed.push(f.name + ' (' + e.message + ')'); }
  }
  S.master = null; await ensureMaster().catch(() => {});
  const warn = (res.warnings || []).map(w => `<div class="warn-box">${ic('alert')}<span>${esc(w)}</span></div>`).join('');
  const bad = failed.length ? `<div class="warn-box">${ic('alert')}<span>Bukti gagal diunggah: ${esc(failed.join('; '))}. Unggah ulang lewat Daftar Transaksi.</span></div>` : '';
  const bg = modal(`<h3>Transaksi tersimpan</h3><p style="color:var(--muted);margin:4px 0 0">Tulis nomor ini di nota fisik sebelum disteples:</p><div class="big-no">${esc(res.nomor_bukti)}</div>${res.nomor_bayar ? `<p style="text-align:center;margin:0">Pembayaran otomatis: <b>${esc(res.nomor_bayar)}</b></p>` : ''}<div class="kv"><div><small>DPP</small><b>${rp(res.dpp)}</b></div><div><small>PPN</small><b>${rp(res.ppn)}</b></div><div><small>Total</small><b>${rp(res.total)}</b></div></div>${warn}${bad}<div class="acts"><button class="btn" data-x="list">Lihat transaksi</button><button class="btn primary" data-x="again">Catat lagi</button></div>`, { noFocus: true });
  bg.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; closeModal(); if (b.dataset.x === 'again') { S.txType = null; go('catat'); } else { S.txType = null; go('daftar'); } });
}

async function viewFile(id) {
  let f; try { f = await api('getFile', { id }); } catch (e) { return toast(e.message, 'bad'); }

  const body = f.mime === 'application/pdf' ? `<iframe title="PDF" src="${src}" style="width:100%;height:70vh;border:0;border-radius:12px"></iframe><p class="hint">Jika PDF tidak tampil, <a href="${src}" download="${esc(f.name)}">unduh file ini</a>.</p>` : `<img alt="Bukti" src="${src}" style="width:100%;border-radius:12px">`;
  modal(`<h3 style="font-size:16px;word-break:break-all">${esc(f.name)}</h3>${body}<div class="acts"><button class="btn primary" data-act="closeModal">Tutup</button></div>`, { wide: true, noFocus: true });

async function upMore(id) {
  const inp = $('#up-file'); inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    try {
      let b64, mime, name = file.name;
      if (file.type === 'application/pdf') { if (file.size > 10485760) throw new Error('PDF lebih dari 10 MB.'); b64 = await fileToB64(file); mime = file.type; }
      else if (file.type.startsWith('image/')) { const c = await compressImage(file, 1600, 'image/jpeg', 0.8); b64 = c.b64; mime = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
      else throw new Error('Hanya JPG, PNG, atau PDF.');
      await api('uploadLampiran', { transaksi_id: id, jenis: $('#up-jenis').value, mime, name, b64 });
      toast('Bukti ditambahkan.'); openTx(id);
    } catch (e) { toast(e.message, 'bad'); }
  };
  inp.click();
}

const REP_CFG = { bukukas: { bulan: 1, akun: 1 }, piutang: { semua: 1 }, hutang: { semua: 1 }, biaya: { bulan: 1 }, labarugi: { periode: 1 }, pajak: { bulan: 1 } };
function repParams() {
  const cfg = REP_CFG[S.page] || {}, p = { tipe: S.page };
  if (cfg.bulan) p.bulan = $('#rp-bulan').value;
  if (cfg.akun) p.akun_kas_id = $('#rp-akun').value;
  if (cfg.semua) p.semua = $('#rp-semua').checked;
  if (cfg.periode) p.periode = $('#rp-mode').value === 'tahun' ? $('#rp-tahun').value : $('#rp-bulan').value;
  return p;
}
function cellHtml(c, v, row) {
  if (c.tipe === 'angka') return `<td class="num">${num(v)}</td>`;
  if (c.tipe === 'tanggal') return `<td>${v ? tgl(v) : ''}</td>`;
  if (c.tipe === 'link') return `<td>${v && v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener" style="color:var(--p);font-weight:600">Lihat</a>` : ''}</td>`;
  return `<td>${esc(v == null ? '' : v)}</td>`;
}
function repTable(rep, extra) {
  const head = rep.kolom.map(c => `<th class="${c.tipe === 'angka' ? 'num' : ''}">${esc(c.label)}</th>`).join('') + (extra ? '<th></th>' : '');
  const body = rep.baris.map(r => `<tr class="${r.b ? 'b' : ''}">${rep.kolom.map(c => cellHtml(c, r[c.k], r)).join('')}${extra ? `<td>${extra(r)}</td>` : ''}</tr>`).join('');
  let tot = '';
  if (rep.baris.length && Object.keys(rep.total || {}).length) tot = `<tr class="total">${rep.kolom.map((c, i) => rep.total[c.k] === 'sum' ? `<td class="num">${num(rep.baris.reduce((s, r) => s + (Number(r[c.k]) || 0), 0))}</td>` : `<td>${i === 0 ? 'TOTAL' : ''}</td>`).join('')}${extra ? '<td></td>' : ''}</tr>`;
  return rep.baris.length ? `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}${tot}</tbody></table></div>` : '<div class="card empty">Tidak ada data pada periode ini.</div>';
}

function masterForm(entity, row) {
  const M = S.master; row = row || {};
  const fields = MFIELDS[entity].map(f => {
    const [k, l, t, req] = f; const v = row[k] !== undefined ? row[k] : (k === 'aktif' ? 'YA' : k === 'pkp' ? 'TIDAK' : k === 'termin_default' ? M.pengaturan.termin : '');
    let inp;
    if (t === 'yn') inp = `<select data-k="${k}"><option value="YA" ${v === 'YA' ? 'selected' : ''}>Ya</option><option value="TIDAK" ${v === 'TIDAK' ? 'selected' : ''}>Tidak</option></select>`;
    else if (t === 'supplier') inp = `<select data-k="${k}">${optList(M.supplier.filter(act), s => s.id, s => s.nama, v, 'Pilih supplier')}</select>`;
    else if (t.indexOf('select:') === 0) inp = `<select data-k="${k}">${t.slice(7).split(',').map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else inp = `<input data-k="${k}" type="${t === 'number' ? 'number' : 'text'}" value="${esc(v)}" ${t === 'number' ? 'min="0"' : ''} maxlength="150">`;
    return fld(esc(l) + (req ? ' *' : ''), inp);
  }).join('');
  const bg = modal(`<h3>${row.id ? 'Ubah' : 'Tambah'} data</h3><div style="margin-top:14px">${fields}</div><div class="acts"><button class="btn" data-x="no">Batal</button><button class="btn primary" data-x="ok">Simpan</button></div>`);
  bg.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'no') return closeModal();
    const data = {}; $$('[data-k]', bg).forEach(i => { data[i.dataset.k] = i.value; }); if (row.id) data.id = row.id;
    try { await api('saveMaster', { entity, row: data }); toast('Tersimpan.'); closeModal(); go('master'); } catch (x) { toast(x.message, 'bad'); }
  });
}

document.addEventListener('click', e => {

document.addEventListener('focusout', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.note !== undefined) { // catatan baris tutup buku
    const id = t.dataset.note; if (!S.tutupBulan) return;
    try { await api('setTanda', { bulan: S.tutupBulan, transaksi_id: id, tanda: t.dataset.tanda || 'BELUM', catatan: t.value }); } catch (x) { toast(x.message, 'bad'); }
  }
  if (t.dataset && t.dataset.tot !== undefined) {
    try { await api('setCekTotal', { bulan: S.tutupBulan, kategori: t.dataset.tot, nilai: t.value }); const y = APP.scrollTop; await go('tutup'); APP.scrollTop = y; } catch (x) { toast(x.message, 'bad'); }
  }
});
document.addEventListener('change', e => { if (e.target.id === 'rp-mode') { const t = e.target.value === 'tahun'; $('#w-bulan').classList.toggle('hidden', t); $('#w-tahun').classList.toggle('hidden', !t); } });

/* ------------------------------ PWA: instal ke PC/HP ------------------------------ */
let pwaDeferred = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  pwaDeferred = e;
  const b = document.getElementById('btn-install');
  if (b) b.classList.remove('hidden');
});
window.addEventListener('appinstalled', () => {
  pwaDeferred = null;
  const b = document.getElementById('btn-install');
  if (b) b.classList.add('hidden');
  toast('Aplikasi berhasil diinstal.');
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* wajar gagal jika sw.js belum ada di hosting ini (mis. Blogspot) */ });
  });
}

boot();
